name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      play-track:
        description: Also upload the app bundle and the store listing to this Google Play track (run it on a version tag)
        type: choice
        options: [none, internal, alpha, beta, production]
        default: none
      play-release-status:
        description: Google Play release status (only "draft" until the app is first published)
        type: choice
        options: [draft, completed]
        default: draft

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pushing a version tag publishes to Google Play: to the PLAY_TRACK repository variable's track (internal by default),
  # as PLAY_RELEASE_STATUS (draft by default). A manual run on a version tag publishes to the track it is given.
  PLAY_TRACK: >-
    ${{ !startsWith(github.ref, 'refs/tags/v') && 'none'
    || github.event_name == 'push' && (vars.PLAY_TRACK || 'internal')
    || inputs.play-track }}
  PLAY_RELEASE_STATUS: >-
    ${{ github.event_name == 'push' && (vars.PLAY_RELEASE_STATUS || 'draft')
    || inputs.play-release-status || 'draft' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version-name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v6

      # A tag vX.Y.Z gives version X.Y.Z, and versionCode X*10000 + Y*100 + Z (v1.6.2: 10602), so each release
      # installs over the previous one and Play accepts it. Other builds, for testing only, get the run number.
      - name: Compute version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
            if [[ ! "$name" =~ ^([0-9]+)\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
              echo "::error::Version tags must be vX.Y.Z, with Y and Z below 100 (got $GITHUB_REF_NAME)."
              exit 1
            fi
            code=$(( 10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]} ))
          else
            name="0.0.${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
            code="$GITHUB_RUN_NUMBER"
          fi
          echo "Version $name, versionCode $code"
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # KEY_PASSWORD may be left out: it then defaults to the keystore password (PKCS12).
            for name in KEYSTORE_PASSWORD KEY_ALIAS; do
              if [ -z "${!name}" ]; then
                echo "::error::KEYSTORE_BASE64 is set but the $name secret is missing. See README, Release signing."
                exit 1
              fi
            done
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ "$PLAY_TRACK" != none ]; then
            echo "::error::Google Play only accepts bundles signed with your upload key: set the KEYSTORE_BASE64 secret. See README, Release signing."
            exit 1
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set. The APK is signed with a throwaway debug key, so it cannot be installed over a previous build without uninstalling (which erases app data). See README."
          fi

      - name: Test and build release APK and app bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease bundleRelease

      - name: Rename outputs
        run: |
          mv app/build/outputs/apk/release/app-release.apk "TimeClicker-${VERSION_NAME}.apk"
          mv app/build/outputs/bundle/release/app-release.aab "TimeClicker-${VERSION_NAME}.aab"

      - uses: actions/upload-artifact@v7
        with:
          name: TimeClicker-${{ env.VERSION_NAME }}
          path: TimeClicker-*.apk
          if-no-files-found: error

      # The bundle for Google Play, with the R8 mapping that deobfuscates its crash reports.
      - uses: actions/upload-artifact@v7
        with:
          name: TimeClicker-${{ env.VERSION_NAME }}-bundle
          path: |
            TimeClicker-*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: TimeClicker-${{ needs.build.outputs.version-name }}

      - uses: softprops/action-gh-release@v3
        with:
          files: TimeClicker-*.apk
          generate_release_notes: true

  google-play:
    # Only version tags: their versionCode is the one Play orders releases by.
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.play-track != 'none')
    needs: build
    runs-on: ubuntu-latest
    # Required reviewers or branch rules can be added to this environment in the repository settings.
    environment: google-play
    steps:
      # The store listing: fastlane/metadata/android, uploaded as committed (tools/store makes it).
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: TimeClicker-${{ needs.build.outputs.version-name }}-bundle
          path: bundle

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Upload to Google Play
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          SUPPLY_PACKAGE_NAME: dev.cfaz.timeclicker
          SUPPLY_TRACK: ${{ env.PLAY_TRACK }}
          SUPPLY_RELEASE_STATUS: ${{ env.PLAY_RELEASE_STATUS }}
          SUPPLY_METADATA_PATH: fastlane/metadata/android
          # Only images that changed since the last upload are sent again.
          SUPPLY_SYNC_IMAGE_UPLOAD: "true"
          SUPPLY_SKIP_UPLOAD_APK: "true"
        run: |
          if [ -z "$SUPPLY_JSON_KEY_DATA" ]; then
            echo "::error::The PLAY_SERVICE_ACCOUNT_JSON secret is not set. See README, Publishing to Google Play."
            exit 1
          fi
          fastlane supply \
            --aab "bundle/TimeClicker-${{ needs.build.outputs.version-name }}.aab" \
            --mapping bundle/app/build/outputs/mapping/release/mapping.txt
