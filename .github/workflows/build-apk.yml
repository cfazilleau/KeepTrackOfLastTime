name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Monotonic versionCode so each APK installs as an update over the previous one.
      VERSION_CODE: ${{ github.run_number }}
    outputs:
      version-name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v6

      - name: Compute version name
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="0.0.${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          fi
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # KEY_PASSWORD may be left out: it then defaults to the keystore password (PKCS12).
            for name in KEYSTORE_PASSWORD KEY_ALIAS; do
              if [ -z "${!name}" ]; then
                echo "::error::KEYSTORE_BASE64 is set but the $name secret is missing. See README, Release signing."
                exit 1
              fi
            done
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set. The APK is signed with a throwaway debug key, so it cannot be installed over a previous build without uninstalling (which erases app data). See README."
          fi

      - name: Test and build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk "TimeClicker-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: TimeClicker-${{ env.VERSION_NAME }}
          path: TimeClicker-*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: TimeClicker-${{ needs.build.outputs.version-name }}

      - uses: softprops/action-gh-release@v3
        with:
          files: TimeClicker-*.apk
          generate_release_notes: true
